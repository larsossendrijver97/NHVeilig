<!-- Recent bezochte communities — homepage-blok. Kies één variant.

     WEERGAVE
       data-recent-communities-variant="detailed"   Figma-ontwerp (weglaten = eenvoudige lijst)
       data-recent-communities-hide-status          slotje en oogje niet tonen
       data-recent-communities-limit="3"            3 per keer + "Laad meer" (weglaten = alles)
       data-recent-communities-max-height="448"     maximale hoogte, lijst scrolt
       data-recent-communities-overflow="fade"      onderkant vervaagt ("hard" = strakke rand)
       data-recent-communities-hide-empty           verbergen zolang de lijst leeg is

     KNOP PER COMMUNITY (alleen bij variant="detailed")
       1. Opslag   data-recent-communities-storage  "local" (standaard) | "favorite"
       2. Gedrag   data-recent-communities-action   "remove" | "pin" | "none"
                   standaard: local -> "remove", favorite -> "pin"
                   data-recent-communities-pin-mode "top" (standaard) | "keep"
       3. Icoon    data-recent-communities-icon     "x" | "star" | "pin"
                   standaard: remove -> x, pin + favorite -> star, pin + local -> pin
-->

<!-- Verloop-variant, vastzetten als Pleio-favoriet (ster) -->
<div data-recent-communities data-recent-communities-variant="detailed" data-recent-communities-storage="favorite" data-recent-communities-max-height="448" data-recent-communities-overflow="fade" data-recent-communities-hide-empty>
  <h3>Jouw recente communities</h3>
  <ul data-recent-communities-list></ul>
</div>

<!-- Verloop-variant, kruisje om uit de lijst te halen (alleen deze browser) -->
<div data-recent-communities data-recent-communities-variant="detailed" data-recent-communities-storage="local" data-recent-communities-max-height="448" data-recent-communities-overflow="fade" data-recent-communities-hide-empty>
  <h3>Jouw recente communities</h3>
  <ul data-recent-communities-list></ul>
</div>

<!-- Eenvoudige variant -->
<div data-recent-communities data-recent-communities-limit="3" data-recent-communities-hide-empty>
  <h3>Jouw recente communities</h3>
  <ul data-recent-communities-list></ul>
  <button type="button" data-recent-communities-more hidden>Laad meer</button>
</div>
